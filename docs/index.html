<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<!-- ADDED TO THE HOME SCREEN, this launches with no browser chrome at all —
     no address bar to hide, because there is no address bar. The manifest is a
     data: URL so the "one self-contained file" rule survives; Chrome accepts
     that, and anything that does not simply ignores it and falls back to the
     Fullscreen API, which is what the first touch asks for anyway. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<title>Racer</title>
<style>
  /* ---- THE EDGES OF THE GLASS THAT ARE NOT YOURS ----
     Android in LANDSCAPE puts its gesture bar down one SIDE, not along the
     bottom, and an in-app browser adds its own furniture on top of that. On
     Anthony's wife's Samsung — a 592x212 CSS viewport at dpr 2.81, in a webview
     that refuses fullscreen outright — the control panel pinned to `right: 8px`
     ran straight underneath the system bar. His report: "the right hand buttons
     are half covered and extremely difficult to use. I couldn't even get the
     full screen one to work... a new player would just close the app and write
     it off as useless."
     Every layer of UI here had insets on the TOP and BOTTOM and none on the
     SIDES, which in portrait is invisible and in landscape is the whole
     problem. These four hold every edge in one place.
     THEY ARE CUSTOM PROPERTIES RATHER THAN env() USED DIRECTLY, and that is so
     they can be MEASURED. There is no way to make a headless browser report a
     safe-area inset, so a test could only ever confirm the CSS was written —
     never that it worked. tools/menufit.mjs overrides these four with real
     Android values and re-runs the whole fit sweep against them. */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d14; color: #e8e6df;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* Stops the browser from scrolling, rubber-banding or firing a
       double-tap-to-zoom delay on every touch. Without this a phone adds
       ~300ms to the first tap of every gesture. */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { display: block; width: 100%; height: 100%; }

  /* ---- the readout ----
     This is the entire point of the skeleton. It has to be legible on a small
     bright screen at arm's length, so it is large and high-contrast rather
     than tasteful. It goes when the numbers are known. */
  #hud {
    /* RIGHT-INSET PAST THE BUTTONS. Making the readout fit the viewport was
       only half the problem: the second column then ran underneath the control
       grid and was unreadable in exactly the screenshot it exists for. The
       first fit test measured the panel against the WINDOW and passed it while
       this was happening — an instrument that checks one edge and not the
       other. 196px is the grid at its widest (two 82px buttons, a 6px gap and
       its 8px right offset) plus a little air. */
    position: fixed; top: 0; left: 0; right: 196px;
    padding: max(10px, var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));
    /* 11px, NOT 13. Measured on Anthony's phone: a 1440x720 canvas at dpr 2.00
       is a 360px-tall CSS viewport, and eighteen lines at 13px came to about
       416px — so the device line clipped mid-word and the two most useful lines
       in a stranger's screenshot were the two below the fold. */
    font-size: 11px; line-height: 1.45; letter-spacing: 0.02em;
    background: linear-gradient(#000b, #0000);
    pointer-events: none;
  }
  /* TWO COLUMNS, because the panel exists to be photographed. What CHANGES as
     you drive goes left; what IDENTIFIES the run goes right, so a screenshot
     carries both and neither has to be scrolled to. */
  #hcols { display: flex; gap: 18px; align-items: flex-start; }
  /* THE TYPE IS SIZED FROM THE SPACE THERE ACTUALLY IS, not from a breakpoint.
     Two columns of `pre` text need about 92 characters across, and what is
     available is the viewport less the button grid and the padding — so the
     font size that fits is (100vw - 220px) / 92 / 0.6, which is the calc
     below. A breakpoint could only ever be right on one side of itself: at 700
     it left the columns colliding, and once that was fixed it left them 56px
     into the buttons at 720. An expression cannot be wrong on one screen and
     right on the next. */
  #hud { font-size: clamp(7px, calc((100vw - 220px) / 55), 11px); line-height: 1.4; }
  /* BOTH COLUMNS ARE `pre` AND NEITHER SHRINKS. Letting the right one wrap
     looked flexible and was the opposite: as a flex item with a wrappable
     white-space it had almost no minimum width, so the left column took what
     it wanted and squeezed the right one to 110px — six lines of text became a
     twenty-one line tower 335px tall. Long values are now wrapped in
     JavaScript at a known column count, so both widths are predictable and
     the layout cannot be renegotiated behind my back. */
  #stats, #stats2 { white-space: pre; flex: 0 0 auto; }
  #fps { font-size: 30px; font-weight: 700; letter-spacing: 0; }
  .lo { color: #ff6b5e; }
  .mid { color: #ffcc55; }
  .ok { color: #7ee081; }
  /* Test controls live TOP-RIGHT, deliberately away from where the thumbs go.
     The bottom corners are the brake and the boost now, and a test button you
     hit while braking is a test button in the wrong place. */
  #ctl {
    position: fixed; right: calc(8px + var(--sar)); top: max(8px, var(--sat));
    display: grid; grid-template-columns: repeat(2, auto);
    gap: 6px; z-index: 5;
  }
  #ctl button {
    font: inherit; font-size: 11px; letter-spacing: 0.04em;
    min-width: 82px; min-height: 40px; padding: 0 8px;
    color: #e8e6df; background: #171a2bdd;
    border: 1px solid #ffffff2e; border-radius: 6px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
    touch-action: manipulation;
  }
  #ctl button:active { background: #2a3550ee; }
  #ctl .wide { grid-column: span 2; }
  /* LEAN IS THE DEFAULT, so a tester who opens the file sees a game rather than
     a diagnostic screen. The readout and the instrument buttons are hidden
     together, because half a HUD is worse than either whole one — the numbers
     are only useful next to the dials that change them. */
  body.lean #hud, body.lean #ctl .dev { display: none; }

  /* THE PEDAL HINTS ARE NOT HERE ANY MORE, and that is the point of the
     change. They were two divs saying BRAKE and BOOST in 12px grey at 19%
     opacity with a faint corner wash behind them — a web page's caption laid
     over a drawn cockpit, and the only thing in the frame that looked like a
     web page. They are now a drilled alloy pedal and a nitrous bottle, drawn
     in code into the cockpit's own atlas and shown on two more quads of the
     one draw call that was already there, in the same palette and the same ink
     weight as the steering wheel's spokes: src/car/cockpit.js, drawPedal and
     drawBottle.
     NOTHING ABOUT THE TOUCH REGIONS CHANGED. They were never these divs —
     pointer-events was none, precisely so the label could not swallow the
     input it was advertising — and they still are not: the region is
     PEDAL_TOP and PEDAL_W, tested in readTouches, and the art is now placed
     from those same two constants. tools/controls.mjs drives the real page
     with real touches and says so. */

  /* THE FAILURE PANEL. A black screen is the worst bug report there is: the
     tester says "it didn't work", and that one sentence covers a device too old
     for WebGL2, a half-finished download, and a mistake I made an hour ago.
     This turns all three into different sentences. */
  #fail { display: none; position: fixed; inset: 0; z-index: 99;
    background: #0b0d14; color: #e8e6df; padding: 18px;
    font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap;
    word-break: break-word; }
  #fail b { color: #ff6b5e; font-size: 16px; }
  #note { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px calc(12px + var(--sar)) max(10px, var(--sab)) calc(12px + var(--sal));
    font-size: 12px; color: #8a8b93; text-align: center;
    background: linear-gradient(#0000, #000b); pointer-events: none; }

  /* ---- THE LANDING PAGE ----
     A stack over the canvas rather than a second page: one HTML file is the
     rule, and it means the game is already built and idling on the grid behind
     the menu, so RACE is a class change and not a load.

     EVERY SIZE HERE IS IN vmin, NOT px OR vh. The page has to work from a
     672x280 phone in a browser with its chrome showing up to a 932x430 iPhone
     at three times the pixel density, and the thing that actually varies
     between those is not width or height on its own — it is the SHORTER of the
     two, which on a landscape phone is always the height. Sizing from vmin
     means the menu shrinks when the address bar appears instead of running off
     the bottom, which is the failure the readout hit twice before it was
     measured. tools/menufit.mjs checks it on six screens. */
  #menu { position: fixed; inset: 0; display: none; z-index: 40;
          font-family: inherit; color: #e8e6df; overflow: hidden; }
  #menu.show { display: block; }
  /* The city sits under everything and is deliberately not sharp: it is a
     704px image on a screen that may be 2796 device pixels across. Scaled to
     cover and pushed back with a scrim, which is what a background is for. */
  #mBg { position: absolute; inset: 0; background-size: cover;
         background-position: center 62%; }
  #mScrim { position: absolute; inset: 0;
            background: radial-gradient(120% 90% at 50% 42%, #0b0d1466 0%, #0b0d14dd 72%, #0b0d14f2 100%); }

  .mPanel { position: absolute; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: max(2vmin, var(--sat)) calc(3vmin + var(--sar))
                     max(2vmin, var(--sab)) calc(3vmin + var(--sal)); }
  .mPanel.on { display: flex; }

  /* SIZED FOR THE SHORTEST SCREEN THERE IS, which is a 592x212 CSS viewport —
     an in-app browser in landscape on a mid-range Samsung. At the first set of
     numbers the front page was four pixels too tall there: not a disaster, but
     the front page is the one screen that must never need scrolling, and four
     pixels of overflow on a phone somebody is meeting the game on for the
     first time is four pixels too many. There is about twenty pixels of slack
     in it now. */
  #mTitle { font-size: 7vmin; letter-spacing: 0.14em; font-weight: 700;
            text-shadow: 0 0.4vmin 1.6vmin #000c; margin-bottom: 0.2vmin; }
  .mSvu { color: #8ee23f; }
  /* The car overlaps the buttons slightly and sits behind them, which is what
     stops the page reading as a title, a picture and a list stacked in three
     separate bands. */
  /* THE CAR GIVES WAY TO THE BUTTONS, and it should. It is the best-looking
     thing on the page and it is also the only part of it nobody needs: a
     player who cannot see a button cannot start the game. Every time a control
     has been added the car has come down to pay for it — 34vmin, then 27, now
     21 — because the shortest screen this runs on is 212 CSS pixels tall and
     six buttons plus a title plus a hero image do not fit in it by wishing. */
  /* NO NEGATIVE MARGIN UNDER IT ANY MORE. The buttons used to be pulled up
     into the car to save a few pixels back when there were three rows of them;
     with two there is room, and Anthony's note was specifically that RACE
     "ruins the shot of the car". It clears it now. */
  #mCar { width: min(74vmin, 62%); max-height: 30vmin; object-fit: contain;
          margin: -0.5vmin 0 max(14px, 4.4vmin) 0; filter: drop-shadow(0 1vmin 2vmin #000a); }
  /* THE BLOCK. Three equal columns and two rows, every cell the same size, so
     it reads as one object rather than as six things that happen to be near
     each other. Equal columns are what make it a block: sized to their content
     they would be a ragged edge on both rows.

     RACE IS MARKED OUT BY COLOUR, NOT BY SIZE, for the same reason — a taller
     or wider cell would break the rectangle that is the whole point.

     LESS TALL THAN THEY WERE. Anthony asked for daylight between the car and
     the top row and offered the height to pay for it: "the buttons could be
     less tall if that is the best way to achieve this." They are, and the gap
     under the car is now 2.4vmin of margin instead of a negative one. Still a
     40px floor on the short side, because a thumb needs it whatever the design
     wants. */
  /* minmax(0, 1fr) AND NOT 1fr. A bare `1fr` is `minmax(auto, 1fr)`, so a cell
     whose contents will not shrink can push its column wider than the other
     two — and one of these labels is longer than the others. Measured: with
     the button reading NO FULL SCREEN the columns came out 119/87/87 and RACE
     sat 15.8px off the centre of the page, in the one state nobody would think
     to screenshot. minmax(0, ...) forbids it. */
  #mGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
           gap: 1.2vmin; justify-items: stretch; align-items: stretch;
           /* SIZED FROM THE WIDTH, NOT FROM vmin. On a landscape phone vmin is
              the HEIGHT, so `min(84vmin, 96%)` gave a 178px-wide block on a
              592px-wide screen — three columns of 58px with FULL SCREEN and
              LAP TIMES spilling straight out of them. It looked fine right up
              until the columns were forced equal, because before that each one
              had quietly grown to fit its own label. A px floor is what makes
              it survive a short screen; the vmin term lets it grow on a big
              one; 94% keeps it off the edges of a narrow one. */
           width: min(94%, max(330px, 76vmin));
           position: relative; z-index: 2; }
  #mGrid .mB { width: 100%; padding: max(6px, 1vmin) max(6px, 1.4vmin);
               min-height: max(40px, 7vmin); white-space: nowrap; }
  /* And the longest label of the three gets a smaller type size so it fits the
     cell it is no longer allowed to widen. */
  .mB.mDead { color: #7b8290; border-color: #2a2f3a; font-size: max(9px, 2vmin); }

  #mBest { margin-top: 1.2vmin; font-size: max(9px, 2.2vmin); color: #9aa0ad;
           letter-spacing: 0.06em; text-align: center; }

  /* THE BUTTONS ARE BIG BECAUSE THIS IS A PHONE. 9vmin of height on a 280px
     viewport is 25px, which is under the 44px everybody agrees a thumb needs —
     so there is a px floor under the vmin. The floor is what actually applies
     on the smallest screen and the vmin is what applies on the largest. */
  .mB { font: inherit; font-size: max(11px, 2.6vmin); letter-spacing: 0.08em;
        color: #e8e6df; background: #171a22cc; border: 1px solid #3a4150;
        border-radius: 1vmin; padding: max(9px, 1.7vmin) max(14px, 3vmin);
        min-height: max(40px, 8vmin); cursor: pointer;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .mB:active { background: #232836; }
  /* And the longest label of the three gets a smaller type size so it fits the
     cell it is no longer allowed to widen. */
  .mB.mDead { color: #7b8290; border-color: #2a2f3a; font-size: max(9px, 2vmin); }
  .mB.mBig { background: #2f7d1acc; border-color: #8ee23f; }
  .mB.mBig:active { background: #3f9a26; }

  .mCard { background: #0b0d14ee; }
  .mCard h2 { font-size: 4vmin; letter-spacing: 0.12em; margin: 0 0 2vmin 0; font-weight: 700; }
  .mCard p { max-width: 74vmin; text-align: center; font-size: max(11px, 2.4vmin);
             line-height: 1.5; color: #9aa0ad; margin: 0 0 2.5vmin 0; }
  .mCard .mBack { margin-top: 2.5vmin; }
  .mRow2 { display: flex; gap: 1.6vmin; margin-top: 2.5vmin; }
  .rBig { color: #e8e6df !important; font-size: max(13px, 3vmin) !important; }
  .rNote { font-size: max(10px, 2.1vmin) !important; }

  /* NOWRAP ON BOTH SIDES. "TOP SPEED" and "271 mph" both broke over two lines
     in the results card at 844x390 — a flex row will happily wrap its children
     to honour a gap, and the gap was 6vmin. These are labels and numbers, not
     prose; they should push the row wider or shrink, never fold. */
  .tRow { display: flex; justify-content: space-between; align-items: baseline;
          gap: 4vmin; width: min(84vmin, 94%); padding: 1.2vmin 0;
          border-bottom: 1px solid #232836; font-size: max(11px, 2.5vmin); }
  .tRow span { color: #9aa0ad; letter-spacing: 0.08em; white-space: nowrap; }
  .tRow b { font-size: max(14px, 3.4vmin); white-space: nowrap; }
  .tRow b.good { color: #8ee23f; }
  .tNote { margin-top: 2vmin !important; }

  /* SETTINGS SCROLLS, and it is the only thing here that does. Seven rows with
     their explanations do not fit a 280px-tall phone at any font size worth
     reading, and the alternative — dropping the explanations — would leave a
     row called CAP that nobody outside this repo could interpret. */
  /* THE FADE AT THE BOTTOM IS NOT DECORATION. Photographed at 844x390 the list
     simply stopped mid-row at FRAME CAP with a hard edge, which reads as a
     rendering fault rather than as "there is more below" — and a setting
     nobody knows is there is a setting that does not exist. A mask that eats
     the last few millimetres says scroll without a word or an arrow. */
  #sWrap { position: relative; width: min(84vmin, 96%); }
  #sWrap::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0;
                  height: 7vmin; pointer-events: none;
                  background: linear-gradient(#0b0d1400, #0b0d14ee); }
  #sBody { width: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
           max-height: 58vmin; padding-bottom: 5vmin; touch-action: pan-y; }
  .sRow { display: flex; align-items: center; justify-content: space-between;
          gap: 3vmin; padding: 1.4vmin 0; border-bottom: 1px solid #232836; }
  .sText { text-align: left; }
  .sLabel { font-size: max(11px, 2.5vmin); letter-spacing: 0.08em; }
  .sNote { font-size: max(9px, 1.9vmin); color: #7b8290; line-height: 1.4; margin-top: 0.4vmin; }
    /* THE ONE NOTE THAT IS AN INSTRUCTION RATHER THAN A DESCRIPTION. Used only
       when iOS has blocked motion access and the player has to go and undo it
       — see TILT_NOTE in src/ui/menu.js. Amber rather than red: nothing is
       broken, there is just something to do. */
    .sNote.sWarn { color: #e8b23c; }
    /* The track you are already on. Dimmed rather than hidden — a disabled
       button that still reads DRIVING tells you where you are; removing it
       leaves a gap you have to interpret. */
    .mB.trkHere { opacity: .55; }
  .sCtl { display: flex; align-items: center; gap: 1.2vmin; flex: none; }
  .sSw { min-width: max(56px, 12vmin); }
  .sSw.on { background: #2f7d1acc; border-color: #8ee23f; }
  .sStep { min-width: max(40px, 8vmin); padding-left: 0; padding-right: 0; }
  .sVal { min-width: max(52px, 11vmin); text-align: center;
          font-size: max(10px, 2.2vmin); color: #9aa0ad; }
  .sVal.sWide { min-width: max(76px, 16vmin); text-align: right; }
  #mFs { margin-top: 0.6vmin; font-size: max(9px, 2vmin); color: #6f7684;
         letter-spacing: 0.05em; text-align: center; }

  /* WHILE THE MENU IS UP, THE TRACK'S OWN FURNITURE GOES. The note, the control
     panel and the readout are all for someone who is driving. */
  body.inMenu #note, body.inMenu #hud { display: none !important; }

  /* THE OLD ON-TRACK PANEL IS GONE FROM THE SCREEN BUT NOT FROM THE PAGE.
     Everything it did is in Settings now. It stays in the DOM, hidden, for one
     reason: tools/nosdash.mjs presses SCENERY minus forty times to clear seven
     thousand buildings before it photographs the dashboard, and two other
     harnesses reach for these ids as well. A hidden button still answers
     .click(), so the rigs keep working and the player never sees a control
     panel bolted to their windscreen. Delete the div and three tools go dark
     at once — which is exactly the kind of breakage that gets discovered a
     week later by a screenshot that looks subtly wrong. */
  #ctl { display: none !important; }

  /* ---- THE GEARS ----
     THESE ARE NOT DEBUG CONTROLS AND I FILED THEM AS ONE. When the landing page
     took the on-track panel away, GEAR - and GEAR + went with it — and they are
     the only way to change gear on a phone, so the car was stuck in first with
     no way out. Anthony, one lap later: "Major bug with the latest version, how
     to change gear". The old panel's own comment even said it: the speed dial
     "is now the gearstick", which is a player control wearing a developer's
     clothes. Sorted by giving them their own layer that has nothing to do with
     the panel.

     WHERE THEY GO. The bottom corners are the brake and the boost, and the top
     half steers when tilt is off, so there is no truly empty ground — but these
     stop the touch reaching the canvas, so overlapping a steering half costs
     nothing. Right-hand edge, stacked, at thumb height for a phone held in
     landscape, and INSET so the system gesture bar cannot sit on top of them.
     That last part is the whole of the bug Anthony hit on the Samsung. */
  #gears { position: fixed; z-index: 30;
           right: calc(10px + var(--sar)); top: 50%; transform: translateY(-50%);
           display: flex; flex-direction: column; gap: 8px; }
  body.inMenu #gears { display: none; }
  #gears button {
    font: inherit; font-size: max(11px, 2.4vmin); letter-spacing: 0.06em;
    color: #e8e6df; background: #171a22cc; border: 1px solid #3a4150;
    border-radius: 10px; min-width: max(58px, 11vmin); min-height: max(46px, 9vmin);
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #gears button:active { background: #2f7d1acc; border-color: #8ee23f; }
  /* The lamp on the tacho already says "shift up now". This makes the button it
     is telling you to press say it too, because a tell-tale that points at a
     control the player has not found yet is a tell-tale pointing at nothing. */
  #gears button.want { border-color: #8ee23f; background: #2f7d1a55; }
  /* Set apart from the two gears, and smaller, because it is a rescue rather
     than something you press every few seconds — but still a full 40px target,
     because the moment you need it is the moment you are already flustered. */
  #gZero { margin-top: 6px; font-size: max(9px, 2vmin); min-height: max(40px, 7vmin);
           opacity: 0.75; }
</style>
</head>
<body class="lean">
<canvas id="c"></canvas>
<div id="hud"><div><span id="fps">--</span> FPS</div>
<div id="hcols"><span id="stats"></span><span id="stats2"></span></div></div>
<div id="fail"></div>
<!-- SHORTER THAN IT WAS, AND MEASURED. It used to end "hold bottom-left to
     BRAKE, bottom-right to BOOST" — 96 characters, which centred at 12px
     monospace is 1382 of the 1440 device pixels on the owner's phone, so the
     line ran straight through both bottom corners. That was invisible while
     the corners held two 19%-opacity captions and became a line of text across
     the brake pedal the moment the corners had a picture in them. The corners
     now say what they are by being a pedal and a nitrous bottle, so the words
     that duplicated them are gone and the line clears both controls with room
     to spare. tools/pedalshots.mjs measures the gap on the real page rather
     than trusting this arithmetic. -->
<!-- THE GEARS. Two buttons, their own layer, nothing to do with the dev panel
     that used to hold them. See the #gears rules for why they came back. -->
<div id="gears">
  <button id="gUp">GEAR &plus;</button>
  <button id="gDown">GEAR &minus;</button>
  <!-- RE-ZERO THE TILT, AND IT HAS TO BE HERE RATHER THAN IN SETTINGS.
       Tilt steering measures from a neutral captured earlier; hold the phone
       differently — reaching for a button, shifting in a seat, leaning into a
       corner — and neutral is wrong, so full lock one way is no longer
       reachable. The car then will not come back and there is nothing on
       screen to fix it.
       CENTRE used to be on the track. I moved it into Settings with the rest
       of the panel, and Settings cannot be opened while racing, so the one
       control that rescues a drifted zero became unreachable at exactly the
       moment you need it. Anthony: "Running off the track on a heavy corner
       and I couldn't steer back onto it."
       The steering itself is fine and was measured rather than assumed —
       tools/recover.mjs holds the car off the road at the sharpest corner on
       the lap and gets it back in under a second at every speed, with a
       control that proves it is reading the steering. Which is what pointed
       at the zero instead. -->
  <button id="gZero">CENTRE</button>
</div>

<!-- THE CONTROLS, IN TWO LAYERS.
     Six buttons a player has a reason to press, then the instruments behind
     TOGGLE. Anthony is about to hand this to testers: "from a player's POV it's
     just not needed... everything brought back with the TOGGLE button for the
     next round of testing and data collection."
     Order is his, and the grid is two columns, so it reads
       CENTRE  FULL SCR / INVERT  TOGGLE / GEAR -  GEAR +
     with the dev pairs appearing underneath. -->
<div id="ctl">
  <button id="bZero">CENTRE</button>
  <button id="bFull">FULL SCR</button>
  <button id="bInv">INVERT</button>
  <button id="bTog">TOGGLE</button>
  <button id="bSlow">GEAR &minus;</button>
  <button id="bFast">GEAR +</button>
  <!-- SOUND IS A PLAYER CONTROL, NOT A DEV ONE. A tester in a quiet room, or
       one recording a screen capture, has to be able to silence it without
       first discovering that TOGGLE exists — so it sits with CENTRE and GEAR
       rather than behind the panel. It spans both columns because the player
       half is otherwise an even six and a seventh button would leave a hole.
       The label is the state, not the action ("SOUND ON" means it is on), and
       the choice survives a reload, because reloading is the most common thing

       desktop and for the harnesses. -->

  <button id="bDown" class="dev">SCENERY −</button>
  <button id="bUp" class="dev">SCENERY +</button>
  <button id="bPixDown" class="dev">PIXELS &minus;</button>
  <button id="bPixUp" class="dev">PIXELS +</button>
  <button id="bCapDown" class="dev">CAP &minus;</button>
  <button id="bCapUp" class="dev">CAP +</button>
</div>

<script>
// ---------------------------------------------------------------------------
// ADD TO HOME SCREEN, WHICH IS THE ONLY RELIABLE WAY OUT OF AN IN-APP BROWSER.
//
// Anthony scanned a QR code from WhatsApp on his wife's Samsung. The QR scanner
// has its own browser, it refused fullscreen outright, and Android's landscape
// gesture bar sat on the controls: "these sort of things are what brakes a
// game." He is right, and the honest answer is that you cannot control which
// browser your link opens in — QR scanners, Instagram, Facebook and half the
// messaging apps on a phone all have their own webview, and none of them will
// go fullscreen.
//
// What you CAN do is make the escape hatch work. On Android, "Add to Home
// Screen" only produces a proper standalone window — no address bar, no
// gesture-bar collision, launches like an app — if the page has a WEB APP
// MANIFEST saying so. Without one you get a bookmark that reopens the same
// browser you were trying to leave. iOS has been covered since the start by
// apple-mobile-web-app-capable; Android needs this.
//
// WHY IT IS BUILT HERE INSTEAD OF BEING A SECOND FILE. The game ships as one
// HTML file and a manifest would be the first thing to break that. A data: URL
// keeps it inline — but it has to be BASE64 and it has to be BUILT AT RUNTIME,
// and both of those were measured rather than assumed:
//
//   - Plain (non-base64) data: URLs break twice over. The `#` in a colour is
//     read as a URL fragment and truncates the JSON mid-string; the quotes
//     then close the href attribute early. Chrome reported "Line: 1, column:
//     132, Syntax error." and parsed nothing.
//   - A STATIC manifest cannot have a working start_url, because a relative
//     URL has nothing to resolve against inside a data: URL and an absolute
//     one has to match the document's origin — which is not knowable when the
//     file is built. Chrome: "property 'start_url' ignored, URL is invalid."
//
//   Built from location.href at boot, over http, Chrome parses it with an
//   EMPTY error list. That is the version that shipped.
//
// Skipped on file:// because a local file cannot be installed anyway, and the
// warnings it would log there are noise in every harness that watches the
// console.
(function () {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    var base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
    var m = {
      name: 'SVU Racer', short_name: 'SVU Racer',
      // FULLSCREEN, NOT STANDALONE. Installed, this is a game and should have
      // the whole glass; standalone still leaves the status bar. display_override
      // is the modern spelling and `display` is the fallback for anything that
      // does not read it — a browser that supports neither lands on standalone,
      // which is still better than the browser it came from.
      display_override: ['fullscreen', 'standalone'],
      display: 'fullscreen', orientation: 'landscape',
      start_url: base, scope: base,
      background_color: '#0b0d14', theme_color: '#0b0d14',

    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json;base64,' + btoa(JSON.stringify(m));
    document.head.appendChild(l);
  } catch (e) { /* an uninstallable page is not a broken one */ }
})();
</script>

    <!-- TWO ROWS, NEVER THREE, AND FULL SCREEN RIDES WITH RACE.
         With five buttons in the lower row it wrapped to three lines, and the
         third pushed RACE up into the car. Anthony: "we are wasting space
         slightly by having three rows when we only need two. That way the play
         button doesn't ruin the shot of the car."
         Putting FULL SCREEN on RACE's line rather than the other one is what
         makes the count stable: it is the only button here that comes and goes
         \u2014 it hides itself once you are fullscreen \u2014 and a row that changes
         length is a row that reflows the whole page under you. On RACE's line
         it can appear and vanish without ever moving anything else. -->
    <!-- SIX BUTTONS, THREE BY THREE, AND THE BLOCK NEVER CHANGES SHAPE.
         Anthony: "We have six buttons at this stage, two rows, so there should
         be three buttons in each row... A nice neat and tidy block of buttons
         beats those screenshots by a mile."
         The thing that makes it hold is that FULL SCREEN no longer disappears
         once it has been used \u2014 it toggles, so the sixth cell is never empty
         and nothing below it ever reflows. When the browser refuses fullscreen
         outright it stays in place too, dimmed and relabelled, because a hole
         in the grid would be worse than a button that cannot do anything.
         RACE is the middle of the top row, so it is the centre of the block as
         well as the centre of the page, and it is marked out by COLOUR rather
         than by size \u2014 a bigger cell would break the rectangle. -->
